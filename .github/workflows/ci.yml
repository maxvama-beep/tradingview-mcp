name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: lint-and-test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberate: the launch detection and the scripts/ helpers
        # are Windows-specific, and launch.test.js exercises per-platform branches.
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # test:unit excludes e2e.test.js, which needs a live TradingView Desktop + CDP.
        run: npm run test:unit

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
